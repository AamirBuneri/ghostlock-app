name: Build GhostLock Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AB Tools repo
        uses: actions/checkout@v4

      - name: Clone ghostlock-app
        run: git clone --depth=1 https://github.com/YuKongA/ghostlock-app.git ghostlock-app

      - name: Download ONDK (topjohnwu NDK with aarch64 clang)
        run: |
          ONDK_VERSION="r30.1"
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "$HOME/ondk"
          curl -fL "$url" -o "$HOME/ondk.tar.xz"
          tar -C "$HOME/ondk" --strip-components=1 -xf "$HOME/ondk.tar.xz"
          echo "NDK_ROOT=$HOME/ondk" >> $GITHUB_ENV
          ls "$HOME/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep "aarch64.*clang$" | head -5

      - name: Build ghostlock binary
        run: |
          cd ghostlock-app

          # Find available clang
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_CC=""
          for api in 35 34 33 32; do
            if [ -f "$NDK_BIN/aarch64-linux-android${api}-clang" ]; then
              NDK_CC="$NDK_BIN/aarch64-linux-android${api}-clang"
              echo "Using: $NDK_CC"
              break
            fi
          done

          if [ -z "$NDK_CC" ]; then
            echo "ERROR: No aarch64 clang found"
            ls $NDK_BIN | grep clang
            exit 1
          fi

          $NDK_CC -O2 -Wall \
            -Isrc/core -Isrc/kernels \
            -DTARGET_CONFIG_H='"target.h"' \
            -fPIE -pie -pthread \
            src/core/main.c \
            src/core/offsets_json.c \
            src/core/util.c \
            src/core/fops.c \
            -o ghostlock

          file ghostlock
          ls -lh ghostlock
          echo "ghostlock binary built successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-binary
          path: ghostlock-app/ghostlock
          retention-days: 30

      - name: Copy to exploits folder and commit
        run: |
          mkdir -p app/src/main/assets/exploits
          cp ghostlock-app/ghostlock app/src/main/assets/exploits/ghostlock
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add app/src/main/assets/exploits/ghostlock
          git diff --staged --quiet || git commit -m "Auto-build: GhostLock binary for non-Pixel devices"
          git push
